    <title>Additional Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: url("assets/Backgrounds.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            object-fit: cover;
            min-height: 100vh;
        }

        #heading {
            text-align: center;
            background-color: whitesmoke;
            padding: 10px 20px;
            margin: 10px auto;
            color: black;
            font-size: 1.9em;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            width: fit-content;
            border-radius: 10px;
        }

        .activity {
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            height: auto;
        }

        .sidebar {
            width: 100px;
            height: fit-content;
            max-height: 65vh;
            overflow-y: auto;
        }

        .sidebar h3 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .questionButtons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .qBtn {
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background-color: #f5f5f5;
            color: black;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            width: 85%;
            text-align: center;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .qBtn:hover {
            background-color: #e8e8e8;
            transform: translateY(-1px);
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);
        }

        .qBtn.active {
            background-color: #f5f5f5;
            box-shadow: none;
            border: 3px solid #000;
            transform: translateY(2px);
        }

        .qBtn:active {
            box-shadow: none;
            border: 3px solid #000;
            transform: translateY(2px);
        }

        .mainContent {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .backGroundMainDiv {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            min-height: 500px;
            flex: 1;
        }

        #backgroundImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            opacity: 0.05;
            z-index: 1;
        }

        .questionContent {
            position: relative;
            z-index: 2;
        }

        .questionText {
            font-size: 1.8em;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
            line-height: 1.4;
        }

        .middleSection {
            display: flex;
            gap: 2%;
            align-items: flex-start;
        }

        .inputMiddleSection {
            display: flex;
            gap: 2%;
            align-items: flex-start;
            min-height: 300px;
        }

        .inputImageSection {
            flex: 0 0 40%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .inputQuestionSection {
            flex: 0 0 58%;
            display: flex;
            flex-direction: column;
        }

        .inputQuestionText {
            font-size: 1.4em;
            margin-bottom: 20px;
            color: #333;
            line-height: 1.4;
            text-align: left;
        }

        .inputBottomSection {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        .inputFeedbackSection {
            flex: 1;
        }

        .inputButtonSection {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .imageSection {
            flex: 0 0 38%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .questionImg {
            max-width: 100%;
            max-height: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .optionsSection {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .middleSection:not(:has(.imageSection)) .optionsSection {
            flex: 0 0 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .inputMiddleSection.no-image {
            display: block;
        }

        .inputMiddleSection.no-image .inputQuestionSection {
            flex: none;
            width: 100%;
        }

        .optionGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .optionBtn {
            padding: 20px;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.6em;
            text-align: center;
            /* display: flex; */
            align-items: center;
            justify-content: center;
            word-break: break-word;
            position: relative;
        }

        .optionBtn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .optionBtn.correct {
            background: #d4edda;
            border-color: #4CAF50;
            color: #155724;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        .optionBtn.incorrect {
            background: #f8d7da;
            border-color: #f44336;
            color: #721c24;
            box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4);
        }

        .optionImage {
            max-width: 280px;
            max-height: 280px;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .optionBtn.image-option {
            min-height: 280px;
            padding: 15px;
        }

        .optionBtn.image-option:hover {
            background: linear-gradient(145deg, #f8f9ff, #e8e9ff);
        }

        .optionBtn.image-option.correct {
            background: linear-gradient(145deg, #d4edda, #c3e6cb);
        }

        .optionBtn.image-option.incorrect {
            background: linear-gradient(145deg, #f8d7da, #f1c2c7);
        }

        .inputGrid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        .inputContainer {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .inputLabel {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            min-width: 80px;
        }

        .answerInput {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #ddd;
            border-radius: 10px;
            font-size: 1.1em;
            text-align: center;
            transition: all 0.3s ease;
            background: white;
        }

       .inline-input {

        .answerInput:focus {

        .answerInput.correct {

        .answerInput.incorrect {

        .checkBtn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
        }

        .checkBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .feedbackText {
            font-size: 1.2em;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            min-height: 30px;
        }

        .emoji {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .nextBtn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .nextBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .finalScreen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border-radius: 20px;
            color: white;
            font-size: 2em;
            text-align: center;
        }

        .finalImage {
            max-width: 300px;
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .activity {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-height: 150px;
                margin-bottom: 20px;
            }

            .questionButtons {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }

            .qBtn {
                width: auto;
                min-width: 50px;
            }

            .middleSection, .inputMiddleSection {
                flex-direction: column;
                gap: 20px;
            }

            .inputImageSection, .inputQuestionSection {
                flex: 1 1 100%;
            }

            .inputBottomSection {
                flex-direction: column;
                gap: 15px;
            }

            .inputButtonSection {
                justify-content: center;
            }

            .questionText, .inputQuestionText {
                font-size: 1.2em;
            }

            .optionGrid {
                grid-template-rows: 1fr 1fr;
                gap: 15px;
            }

            .optionBtn {
                font-size: 1em;
                padding: 15px;
                min-height: 100px;
            }

            .optionBtn.image-option {
                min-height: 120px;
            }

            .optionImage {
                max-width: 200px;
                max-height: 200px;
            }

            .inputContainer {
                flex-direction: column;
                text-align: center;
            }

            .inputLabel {
                min-width: auto;
            }

            .inline-input {
                width: 40px;
                font-size: 1em;
            }
        }

        .optionGrid.three-options {
            grid-template-columns: 1fr 1fr;
        }

        .optionGrid.three-options .optionBtn:nth-child(3) {
            grid-column: 1 / -1;
        }

        .optionGrid.one-option {
            grid-template-columns: 1fr;
        }

        .optionGrid.has-images {
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .optionGrid.has-images .optionBtn {
            min-height: 160px;
        }

        .optionGrid.has-images .optionImage {
            max-width: 260px;
            max-height: 160px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .optionGrid.has-images .optionBtn {
                min-height: 140px;
            }
        }

        .fraction-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            vertical-align: middle;
        }

        .whole-number {
            font-size: 1em;
        }

        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            font-size: 1em;
        }

        .numerator,
        .denominator {
            line-height: 1;
            padding: 2px 4px;
        }

        .fraction-line {
            width: 100%;
            height: 2px;
            background-color: currentColor;
            margin: 2px 0;
        }

        .questionText .fraction-container {
            margin: 0 4px;
        }

        .optionBtn .fraction-container {
            justify-content: center;
        }

        .imageOption {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .imageOption img {
            max-width: 300px;
            max-height: 180px;
            width: 100%;
            object-fit: contain;
            border: 3px solid black;
            border-radius: 12px;
            transition: border 0.3s ease;
            padding: 0 1%;
        }

        .imageOption.correct img {
            border-color: #4CAF50;
        }

        .imageOption.incorrect img {
            border-color: #f44336;
        }

        .imageOption:hover {
            transform: none;
            box-shadow: none;
        }

        .frac-multiply-label {

        let currentIndex = 0;
        let selectedAnswer = null;

        // ─── Style a single SVG-embedded input by id ───────────────────────────────

            const bg    = isCorrect ? '#d4edda' : '#f8d7da';
            const txt   = isCorrect ? '#155724' : '#721c24';
            const el = document.getElementById(elId);
            if (!el) return;
            el.style.background = bg;
            el.style.color = txt;
            el.style.borderColor = color;
            // SVG-embedded input: style the sibling rect
            const fo = el.closest('foreignObject');
            if (fo) {
                let prev = fo.previousElementSibling;
                while (prev) {
                    if (prev.tagName.toLowerCase() === 'rect') {
                        prev.setAttribute('stroke', color);
                        prev.setAttribute('fill', bg);
                        break;
                    }

                el.style.borderColor = color;

        // ─── ONE universal diagram builder ────────────────────────────────────────
        //
        //  Every slot in d (diagram JSON) is either:
        //    "someValue"  →  rendered as fixed bold text
        //    ""           →  rendered as an input box, id taken from d.slots in order
        //
        //  d fields:
        //    op        : "×" or "÷"
        //    fracNum   : left fraction numerator   (fixed or "")
        //    fracDen   : left fraction denominator (fixed or "")
        //    topLabel  : label above top arrow     (fixed or "")
        //    botLabel  : label below bottom arrow  (fixed or "")
        //    resNum    : right fraction numerator  (fixed or "")
        //    resDen    : right fraction denominator(fixed or "")
        //    slots     : array of input ids — consumed left-to-right for every "" slot
        //    arrowId   : unique string for SVG marker ids
        //
        //  Slot consumption order: fracNum, fracDen, topLabel, botLabel, resNum, resDen
        //
        function buildDiagramHTML(d) {
            const op = d.op || '×';
            const aid = d.arrowId;
            let slotIdx = 0;
            const slots = d.slots || [];

            // Returns SVG snippet for a slot: fixed text OR input box
            // tx, ty = text anchor position  |  rx,ry,rw,rh = rect geometry  |  inputH = input height
            function slot(value, id, tx, ty, anchor, fontSize, rx, ry, rw, rh, iw, ih) {
                if (value !== '') {
                    // Fixed text
                    return `<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="${fontSize}" font-weight="bold" fill="#111">${value}</text>`;
                } else {
                    // Input box
                    const sid = slots[slotIdx++] || id;
                    return `
                    <rect id="rect-${sid}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="8" ry="8" fill="white" stroke="#444" stroke-width="3"/>
                    <foreignObject x="${rx}" y="${ry}" width="${rw}" height="${rh}">
                      <div xmlns="http://www.w3.org/1999/xhtml" style="width:${rw}px;height:${rh}px;display:flex;align-items:center;justify-content:center;">
                        <input type="text" id="${sid}" autocomplete="off"
                          style="width:${iw}px;height:${ih}px;border:none;outline:none;font-size:${fontSize}px;font-weight:bold;text-align:center;background:transparent;"/>
                      </div>
                    </foreignObject>`;
                }
            }

            // Label slot (above/below arrow)
            // Fixed: shows "op value" centred above/below arrow
            // Input: op symbol to the LEFT, input box to its RIGHT — always visible
            function labelSlot(value, fallbackId, tx, ty, anchor, rx, ry) {
                if (value !== '') {
                    return `<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="20" font-weight="bold" fill="#222">${op} ${value}</text>`;
                } else {
                    const sid = slots[slotIdx++] || fallbackId;
                    const opX  = 202;   // op symbol ends here (text-anchor=end)
                    const boxX = 207;   // input box starts just after op symbol
                    return `
                    <text x="${opX}" y="${ty}" text-anchor="end" font-size="22" font-weight="bold" fill="#222">${op}</text>
                    <rect id="rect-${sid}" x="${boxX}" y="${ry}" width="65" height="42" rx="7" ry="7" fill="white" stroke="#444" stroke-width="3"/>
                    <foreignObject x="${boxX}" y="${ry}" width="65" height="42">

            }

            const fracNumSVG = slot(d.fracNum,  'fn',  58,  85, 'middle', 62,  12, 38, 80, 60, 70, 48);
            const fracDenSVG = slot(d.fracDen,  'fd',  58, 170, 'middle', 62,  12,125, 80, 60, 70, 48);
            const topSVG     = labelSlot(d.topLabel, 'tl', 245, 22, 'middle', 180,  2);
            const botSVG     = labelSlot(d.botLabel, 'bl', 245,218, 'middle', 180,198);
            const resNumSVG  = slot(d.resNum,   'rn', 432,  85, 'middle', 62, 390, 38, 80, 60, 70, 48);

            return `
            <div style="display:flex; justify-content:center; align-items:center;">

                <defs>
                  <marker id="atop-${aid}" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
                    <path d="M0,0 L0,7 L10,3.5 z" fill="#333"/>

    let totalInputs = q.correct.length;

    for (let i = 0; i < totalInputs; i++) {

        // last value = power input only if question has a power field
        if (q.hasPower && i === totalInputs - 1) {
            pairs.push([`power_0`, q.correct[i]]);
        } else {
            pairs.push([`input_${i}`, q.correct[i]]);
        }
    }
} else if (q.dropdown) {
    q.dropdown.forEach((_, i) => pairs.push([`input_${i}`, q.correct[i]]));
}

            // ── Collect userInputs from the pairs ──────────────────────────────────
            pairs.forEach(([elId]) => {
                const el = document.getElementById(elId);
                userInputs.push(el ? el.value.trim().toLowerCase() : '');
            });

            // ── Check and style each input ─────────────────────────────────────────
            let allCorrect = true;

// Handle unordered indices
let unordered = q.unorderedIndices || [];

let checked = new Set();

pairs.forEach(([elId, correctAnswer], i) => {

    if(unordered.includes(i)){
        return; // skip for now
    }

    const isCorrect = answersMatch(userInputs[i], correctAnswer.trim().toLowerCase());

    if(!isCorrect) allCorrect = false;

    styleInputBox(elId,isCorrect);

    checked.add(i);
});

// check unordered group
if(unordered.length){

    const userVals = unordered.map(i => userInputs[i]);
const correctVals = unordered.map(i => q.correct[i].toLowerCase());

// Try matching each user value to a correct value (numeric-aware)
const usedCorrect = new Set();
const match = userVals.every(uv => {
    const idx = correctVals.findIndex((cv, ci) => !usedCorrect.has(ci) && answersMatch(uv, cv));
    if (idx !== -1) { usedCorrect.add(idx); return true; }
    return false;
});

    unordered.forEach(i=>{
        styleInputBox(pairs[i][0],match);
    });

    if(!match) allCorrect = false;
}

            if (allCorrect) {
                pointSound.currentTime = 0;
                pointSound.play();
                feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
                feedback.style.color = '#4CAF50';

                // Disable all inputs including HCF
                pairs.forEach(([elId]) => {
                    const el = document.getElementById(elId);
                    if (el) el.disabled = true;
                });
                if (q.hcfId) {
                    const hcfEl = document.getElementById(q.hcfId);
                    if (hcfEl) hcfEl.disabled = true;
                }

                if (checkBtn) checkBtn.style.display = 'none';
                nextBtn.innerText = currentIndex + 1 < data.length ? 'Next' : 'Finish';
                nextBtn.style.display = 'block';
            } else {
                failSound.currentTime = 0;
                failSound.play();
                feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
                feedback.style.color = '#f44336';
            }
        }

        function handleOptionClick(index) {
            const pointSound = document.getElementById("points-sound");
            const failSound = document.getElementById("fail");
            if (selectedAnswer !== null) return;

            selectedAnswer = index;
            const q = data[currentIndex];
            const feedback = document.getElementById('feedbackText');
            const nextBtn = document.getElementById('nextBtn');
            const optionBtns = document.querySelectorAll('.optionBtn, .imageOption');

            optionBtns.forEach(btn => { btn.style.pointerEvents = 'none'; });

            if (index === q.correct) {
                pointSound.currentTime = 0;
                pointSound.play();
                optionBtns[index].classList.add('correct');
                feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
                feedback.style.color = '#4CAF50';
                nextBtn.innerText = currentIndex + 1 < data.length ? 'Next' : 'Finish';
                nextBtn.style.display = 'block';
            } else {
                failSound.currentTime = 0;
                failSound.play();
                optionBtns[index].classList.add('incorrect');
                feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
                feedback.style.color = '#f44336';
                optionBtns.forEach((btn, idx) => {
                    if (idx !== index) btn.style.pointerEvents = 'auto';
                });
                selectedAnswer = null;
            }
        }

        function handleNext() {
            if (currentIndex + 1 < data.length) {
                currentIndex++;
                selectedAnswer = null;
                userInputs = [];
                renderQuestion();
            } else {
                currentIndex++;
                renderQuestion();
            }
        }
function answersMatch(userVal, correctVal) {
    if (userVal === correctVal) return true;

    // Try numeric comparison — handles 19.50 vs 19.500, 085 vs 85, etc.
    const userNum = parseFloat(userVal);
    const correctNum = parseFloat(correctVal);
    if (!isNaN(userNum) && !isNaN(correctNum) && userNum === correctNum) return true;

    return false;
}
function autoGrowInput(input) {
    let measurer = document.getElementById('__input_measurer__');
    if (!measurer) {
        measurer = document.createElement('span');
        measurer.id = '__input_measurer__';
        measurer.style.cssText = `
            position: absolute;
            visibility: hidden;
            white-space: pre;
            font-family: Arial, sans-serif;
            padding: 0 6px;
        `;
        document.body.appendChild(measurer);
    }
    const computedStyle = window.getComputedStyle(input);
    measurer.style.fontSize = computedStyle.fontSize;
    measurer.textContent = input.value || '';
    const newWidth = Math.max(50, measurer.offsetWidth + 16);
    input.style.width = newWidth + 'px';
}
